<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Register for Sessions - Conference Management</title>
    <style>
        /* Global Styles */
        body {
            background: #111827;
            color: #ffffff;
        }
        
        /* Page Header */
        .page-header {
            background: #111827;
            color: #ffffff;
            padding: 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
            height: 300px;
            display: flex;
        }
        
        .image-panel {
            flex: 0 0 300px;
            height: 100%;
            overflow: hidden;
            position: relative;
            background: rgba(17, 24, 39, 0.8);
        }
        
        .slideshow {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 1;
        }
        
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }
        
        .slide.active {
            opacity: 0.7;
        }
        
        .conference-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        
        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to right, rgba(17, 24, 39, 0.9), rgba(17, 24, 39, 0.5));
            z-index: 2;
            pointer-events: none;
        }
        
        .title-section {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 3rem;
            z-index: 3;
            position: relative;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
            text-align: center;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        @media (max-width: 992px) {
            .page-header {
                flex-direction: column;
                height: auto;
            }
            
            .image-panel {
                width: 100%;
                flex: 0 0 200px;
            }
            
            .title-section {
                padding: 2rem 1rem;
            }
            
            .title {
                font-size: 2rem;
            }
        }
        
        /* Session Cards */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .session-card {
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s;
            background: rgba(31, 41, 55, 0.8);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        
        .session-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-color: rgba(99, 102, 241, 0.5);
        }
        
        .session-title {
            font-size: 1.25rem;
            margin-bottom: 0.75rem;
            color: #ffffff;
            font-weight: 600;
        }
        
        .session-description {
            color: #d1d5db;
            margin-bottom: 1rem;
            flex-grow: 1;
        }
        
        .session-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        .meta-item {
            display: flex;
            align-items: center;
        }
        
        .meta-item i {
            margin-right: 0.5rem;
            color: #6366f1;
            font-size: 0.875rem;
        }
        
        .register-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: none;
            font-weight: 500;
            width: 100%;
        }
        
        .register-btn i {
            margin-right: 0.5rem;
        }
        
        .register-btn:hover {
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: #9ca3af;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .empty-state i {
            font-size: 3rem;
            color: #6366f1;
            margin-bottom: 1rem;
        }
        
        .alert {
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .alert-success {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }
        
        .alert-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        
        .lead {
            color: #d1d5db;
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        
        .filters {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .filter-btn {
            background: rgba(31, 41, 55, 0.8);
            color: #d1d5db;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .filter-btn:hover, .filter-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        
        @media (max-width: 768px) {
            .sessions-grid {
                grid-template-columns: 1fr;
            }
            
            .session-meta {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <script th:inline="javascript">
        // Set dark theme by default when page loads
        document.addEventListener('DOMContentLoaded', function() {
            document.documentElement.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            const icon = document.querySelector('#themeSwitch i');
            if (icon) icon.className = 'fas fa-sun';
            
            // Generate timestamp for cache busting
            const timestamp = new Date().getTime();
            
            // Update image sources with timestamp to prevent caching
            document.querySelectorAll('.conference-image').forEach(img => {
                const currentSrc = img.getAttribute('src');
                img.setAttribute('src', currentSrc + '?t=' + timestamp);
            });
            
            // Image slideshow functionality
            let currentSlide = 0;
            const slides = document.querySelectorAll('.slide');
            
            if (slides.length > 0) {
                // Show the first slide initially
                slides[0].classList.add('active');
                
                // Function to change slides
                function nextSlide() {
                    // Remove active class from current slide
                    slides[currentSlide].classList.remove('active');
                    
                    // Update current slide index
                    currentSlide = (currentSlide + 1) % slides.length;
                    
                    // Add active class to new current slide
                    slides[currentSlide].classList.add('active');
                }
                
                // Change slide every 5 seconds
                setInterval(nextSlide, 5000);
            }
        });
    </script>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="image-panel">
                <div class="slideshow">
                    <div class="slide active">
                        <img src="/data/conference_image.jpeg" alt="Conference" class="conference-image">
                    </div>
                    <div class="slide">
                        <img src="/data/image1.jpeg" alt="Conference 1" class="conference-image">
                    </div>
                    <div class="slide">
                        <img src="/data/image2.jpeg" alt="Conference 2" class="conference-image">
                    </div>
                </div>
                <div class="image-overlay"></div>
            </div>
            <div class="title-section">
                <h1 class="title">Register for Sessions</h1>
            </div>
        </div>
        
        <div class="container">
            <div class="row mb-4">
                <div class="col">
                    <p class="lead">Browse available sessions and register for the ones you're interested in.</p>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <!-- Sessions List -->
            <div th:if="${not #lists.isEmpty(sessions)}" class="sessions-grid">
                <div th:each="sessionItem : ${sessions}" class="session-card">
                    <h2 class="session-title" th:text="${sessionItem.title}">Session Title</h2>
                    <p class="session-description" th:text="${sessionItem.description}">Session Description</p>
                    <div class="session-meta">
                        <div class="meta-item">
                            <i class="fas fa-users"></i>
                            <span>Capacity: <span th:text="${sessionItem.capacity}">50</span></span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-clock"></i>
                            <span th:text="${#temporals.format(sessionItem.startTime, 'MMM dd, HH:mm')}">Jan 01, 09:00</span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <span>Room: <span th:text="${sessionItem.roomNumber}">101</span></span>
                        </div>
                        <div class="meta-item">
                            <i class="fas fa-calendar-alt"></i>
                            <span th:text="${#temporals.format(sessionItem.startTime, 'yyyy')}">2023</span>
                        </div>
                    </div>
                    <a th:href="@{/register/session/{id}(id=${sessionItem.id})}" class="register-btn">
                        <i class="fas fa-user-plus"></i> Register Now
                    </a>
                </div>
            </div>

            <!-- Empty State -->
            <div th:if="${#lists.isEmpty(sessions)}" class="empty-state">
                <i class="fas fa-calendar-times"></i>
                <h2>No Sessions Available</h2>
                <p>There are currently no sessions available for registration.</p>
            </div>
        </div>
    </div>
</body>
</html>
