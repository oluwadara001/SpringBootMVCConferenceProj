<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${session.id == null ? 'New Session' : 'Edit Session'} + ' - Conference Management System'">Session Form</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="bg-light py-4 mb-4">
            <div class="container">
                <div class="d-flex justify-content-between align-items-center">
                    <h1 class="h3 mb-0" th:text="${session.id == null ? 'New Session' : 'Edit Session'}">Session Form</h1>
                    <a href="/sessions" class="btn btn-outline-primary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Sessions
                    </a>
                </div>
            </div>
        </div>

        <!-- Session Form -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-4">
                            <form th:action="@{/sessions}" th:object="${session}" method="post">
                                <input type="hidden" th:field="*{id}">
                                
                                <!-- Title -->
                                <div class="mb-4">
                                    <label for="title" class="form-label">Session Title</label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                                        Please provide a valid title.
                                    </div>
                                </div>

                                <!-- Description -->
                                <div class="mb-4">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" required></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
                                        Please provide a valid description.
                                    </div>
                                </div>

                                <!-- Room Number -->
                                <div class="mb-4">
                                    <label for="roomNumber" class="form-label">Room Number</label>
                                    <input type="text" class="form-control" id="roomNumber" th:field="*{roomNumber}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('roomNumber')}" th:errors="*{roomNumber}">
                                        Please provide a valid room number.
                                    </div>
                                </div>

                                <!-- Start Time -->
                                <div class="mb-4">
                                    <label for="startTime" class="form-label">Start Time</label>
                                    <input type="datetime-local" class="form-control" id="startTime" th:field="*{startTime}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('startTime')}" th:errors="*{startTime}">
                                        Please provide a valid start time.
                                    </div>
                                </div>

                                <!-- End Time -->
                                <div class="mb-4">
                                    <label for="endTime" class="form-label">End Time</label>
                                    <input type="datetime-local" class="form-control" id="endTime" th:field="*{endTime}" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('endTime')}" th:errors="*{endTime}">
                                        Please provide a valid end time.
                                    </div>
                                </div>

                                <!-- Capacity -->
                                <div class="mb-4">
                                    <label for="capacity" class="form-label">Room Capacity</label>
                                    <input type="number" class="form-control" id="capacity" th:field="*{capacity}" min="1" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('capacity')}" th:errors="*{capacity}">
                                        Please provide a valid capacity.
                                    </div>
                                </div>

                                <!-- Submit Button -->
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary btn-lg">
                                        <i class="fas fa-save me-2"></i>
                                        <span th:text="${session.id == null ? 'Create Session' : 'Update Session'}">Save Session</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Form Validation Script -->
    <th:block layout:fragment="js">
        <script>
            // Form validation
            (function () {
                'use strict'
                var forms = document.querySelectorAll('.needs-validation')
                Array.prototype.slice.call(forms).forEach(function (form) {
                    form.addEventListener('submit', function (event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        form.classList.add('was-validated')
                    }, false)
                })
            })()
        </script>
    </th:block>
</body>
</html>
