<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Sessions</title>
</head>
<body>
    <!-- Page title -->
    <div layout:fragment="page-title">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-5">Sessions</h1>
                <p class="lead text-muted">Manage conference sessions and talks</p>
            </div>
            <div class="col-md-4 text-md-end">
                <a th:href="@{/sessions/new}" class="btn btn-primary">
                    <i class="fas fa-plus-circle me-1"></i> New Session
                </a>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <div layout:fragment="content">
        <!-- Search and filter bar -->
        <div class="card mb-4 border-0 shadow-sm">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-8">
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0">
                                <i class="fas fa-search text-muted"></i>
                            </span>
                            <input type="text" id="searchInput" class="form-control border-start-0" 
                                   placeholder="Search sessions by name, description, speaker...">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <select class="form-select" id="sessionLength">
                            <option value="">Filter by session length</option>
                            <option value="30">30 minutes</option>
                            <option value="60">60 minutes</option>
                            <option value="90">90 minutes</option>
                            <option value="120">120 minutes</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Sessions table -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Session Name</th>
                                <th>Description</th>
                                <th>Length (min)</th>
                                <th>Speakers</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${sessions == null || sessions.empty}">
                                <td colspan="6" class="text-center py-4">
                                    <div class="text-muted">
                                        <i class="fas fa-info-circle me-2"></i>No sessions found
                                    </div>
                                    <a th:href="@{/sessions/new}" class="btn btn-sm btn-primary mt-3">
                                        <i class="fas fa-plus-circle me-1"></i>Add Session
                                    </a>
                                </td>
                            </tr>
                            <tr th:each="session : ${sessions}" th:if="${sessions != null && !sessions.empty}">
                                <td>
                                    <span class="fw-bold" th:text="${session.sessionId}">1</span>
                                </td>
                                <td>
                                    <span th:text="${session.sessionName}">Session Name</span>
                                </td>
                                <td>
                                    <span th:text="${#strings.abbreviate(session.sessionDescription, 50)}">Description</span>
                                </td>
                                <td>
                                    <span th:text="${session.sessionLength}">60</span>
                                </td>
                                <td>
                                    <div th:if="${session.speakers == null || session.speakers.empty}">
                                        <span class="badge bg-light text-dark">No speakers</span>
                                    </div>
                                    <div th:if="${session.speakers != null && !session.speakers.empty}">
                                        <span class="badge bg-info text-dark me-1" 
                                              th:each="speaker : ${session.speakers}" 
                                              th:text="${speaker.firstName + ' ' + speaker.lastName}">
                                            Speaker Name
                                        </span>
                                    </div>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/sessions/{id}(id=${session.sessionId})}" class="btn btn-outline-primary"
                                           data-bs-toggle="tooltip" title="View">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/sessions/{id}/edit(id=${session.sessionId})}" class="btn btn-outline-success"
                                           data-bs-toggle="tooltip" title="Edit">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <a th:href="@{/sessions/{id}/delete(id=${session.sessionId})}" class="btn btn-outline-danger btn-delete"
                                           data-bs-toggle="tooltip" title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Pagination if needed -->
        <div th:if="${sessions != null && !sessions.empty}" class="d-flex justify-content-center mt-4">
            <nav>
                <ul class="pagination">
                    <li class="page-item disabled">
                        <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
                    </li>
                    <li class="page-item active"><a class="page-link" href="#">1</a></li>
                    <li class="page-item"><a class="page-link" href="#">2</a></li>
                    <li class="page-item"><a class="page-link" href="#">3</a></li>
                    <li class="page-item">
                        <a class="page-link" href="#">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
    
    <!-- Add JavaScript for this page -->
    <th:block layout:fragment="js">
        <script>
            // Filter by session length
            document.getElementById('sessionLength').addEventListener('change', function() {
                const length = this.value;
                const rows = document.querySelectorAll('tbody tr');
                
                if (length === '') {
                    rows.forEach(row => row.style.display = '');
                    return;
                }
                
                rows.forEach(function(row) {
                    const lengthCell = row.querySelector('td:nth-child(4)');
                    if (lengthCell && lengthCell.textContent.trim() === length) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
        </script>
    </th:block>
</body>
</html>
