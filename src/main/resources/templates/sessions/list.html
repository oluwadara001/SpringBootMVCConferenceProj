<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Sessions</title>
    <!-- Include back button styles -->
    <th:block th:replace="fragments/navigation :: back-button-styles"></th:block>
    <style>
        /* Global Styles */
        body {
            background: #111827;
            color: #ffffff;
        }
        
        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 1rem 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="none"/><circle cx="3" cy="3" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.3;
        }

        .page-header-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .page-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .page-subtitle {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        /* Search Section */
        .search-section {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            margin-bottom: 1rem;
        }

        .search-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.375rem;
            color: #ffffff;
            font-size: 0.9rem;
        }

        .search-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Sessions Grid */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        /* Session Cards */
        .session-card {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            padding: 0.75rem;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            color: inherit;
        }

        .session-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.2);
            border-color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            color: inherit;
        }

        .session-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .session-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8rem;
        }

        .session-meta i {
            color: #6366f1;
            font-size: 0.75rem;
        }

        .session-description {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .session-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .session-room {
            background: rgba(99, 102, 241, 0.2);
            color: #ffffff;
            padding: 0.2rem 0.5rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .session-room i {
            font-size: 0.7rem;
        }

        @media (max-width: 768px) {
            .sessions-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="container">
                <div class="page-header-content">
                    <h1 class="page-title">Conference Sessions</h1>
                    <p class="page-subtitle">Explore our exciting lineup of sessions</p>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Back button at the top -->
            <div th:replace="fragments/navigation :: back-button('/', 'Back to Home')"></div>
            
            <!-- Search Section -->
            <div class="search-section">
                <input type="text" class="search-input" id="searchInput" placeholder="Search sessions...">
            </div>
            
            <!-- Sessions Grid -->
            <div class="sessions-grid">
                <a th:each="sessionItem : ${sessions}" 
                   th:href="@{/sessions/{id}(id=${sessionItem.id})}" 
                   class="session-card">
                    <h3 class="session-title" th:text="${sessionItem.title}">Session Title</h3>
                    
                    <div class="session-meta">
                        <span>
                            <i class="fas fa-clock"></i>
                            <span th:text="${#temporals.format(sessionItem.startTime, 'MMM dd, HH:mm')}">Start Time</span>
                        </span>
                    </div>
                    
                    <p class="session-description" th:text="${sessionItem.description}">Session Description</p>
                    
                    <div class="session-footer">
                        <span class="session-room">
                            <i class="fas fa-door-open"></i>
                            Room <span th:text="${sessionItem.roomNumber}">Room</span>
                        </span>
                    </div>
                </a>
            </div>
            
            <!-- Back button at the bottom -->
            <div th:replace="fragments/navigation :: back-button('/', 'Back to Home')"></div>
        </div>
    </div>

    <th:block layout:fragment="js">
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const searchInput = document.getElementById('searchInput');
                const sessionCards = document.querySelectorAll('.session-card');

                searchInput.addEventListener('input', function() {
                    const searchTerm = this.value.toLowerCase();
                    
                    sessionCards.forEach(card => {
                        const title = card.querySelector('.session-title').textContent.toLowerCase();
                        const description = card.querySelector('.session-description').textContent.toLowerCase();
                        
                        if (title.includes(searchTerm) || description.includes(searchTerm)) {
                            card.style.display = '';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            });
        </script>
    </th:block>
</body>
</html>
