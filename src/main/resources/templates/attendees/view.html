<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="${attendee.firstName + ' ' + attendee.lastName + ' - Conference Management System'}">Attendee Details</title>
    <!-- Include back button styles -->
    <th:block th:replace="fragments/navigation :: back-button-styles"></th:block>
    <style>
        /* Global Styles */
        body {
            background: #111827;
            color: #ffffff;
        }
        
        /* Page Header */
        .page-header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 1.5rem 0;
            position: relative;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .page-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg width="20" height="20" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><rect width="20" height="20" fill="none"/><circle cx="3" cy="3" r="1" fill="rgba(255,255,255,0.1)"/></svg>') repeat;
            opacity: 0.3;
        }

        .page-header-content {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .page-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Profile Section */
        .profile-section {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #ffffff;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .profile-image-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
        }

        .profile-image-placeholder i {
            font-size: 4rem;
            opacity: 0.5;
        }

        .profile-info {
            flex: 1;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .profile-title {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 1rem;
        }

        .profile-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            background: rgba(99, 102, 241, 0.2);
            color: #6366f1;
        }

        /* Details Section */
        .details-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .detail-card {
            background: rgba(31, 41, 55, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 1.5rem;
        }

        .detail-card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-card-title i {
            color: #6366f1;
        }

        .detail-list {
            display: grid;
            gap: 1rem;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        .detail-item:hover {
            background: rgba(99, 102, 241, 0.1);
            transform: translateX(4px);
        }

        .detail-item i {
            color: #6366f1;
            width: 20px;
            text-align: center;
        }

        .detail-label {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.5);
            min-width: 100px;
        }

        .detail-value {
            font-size: 0.875rem;
            color: #ffffff;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-action {
            flex: 1;
            padding: 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(55, 65, 81, 0.5);
            color: #ffffff;
            font-size: 0.9rem;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-action:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #ffffff;
            text-decoration: none;
            transform: translateY(-2px);
        }

        .btn-action i {
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.4);
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .profile-image {
                width: 120px;
                height: 120px;
                margin: 0 auto;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <!-- Page Header -->
        <div class="page-header">
            <div class="container">
                <div class="page-header-content">
                    <h1 class="page-title" th:text="${attendee.firstName + ' ' + attendee.lastName}">Attendee Name</h1>
                    <p class="page-subtitle">Conference Attendee Profile</p>
                </div>
            </div>
        </div>

        <div class="container">
            <!-- Back button at the top -->
            <div th:replace="fragments/navigation :: back-button('/attendees', 'Back to Attendees')"></div>

            <!-- Profile Section -->
            <div class="profile-section">
                <div class="profile-header">
                    <div class="profile-image">
                        <div class="profile-image-placeholder">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                    <div class="profile-info">
                        <h2 class="profile-name" th:text="${attendee.firstName + ' ' + attendee.lastName}">John Doe</h2>
                        <p class="profile-title" th:if="${attendee.title != null}">
                            <span th:text="${attendee.title}">Job Title</span>
                            <span th:if="${attendee.company != null}" th:text="${' at ' + attendee.company}">at Company</span>
                        </p>
                        <span class="profile-badge">Conference Attendee</span>
                    </div>
                </div>

                <!-- Details Section -->
                <div class="details-section">
                    <!-- Contact Information -->
                    <div class="detail-card">
                        <h3 class="detail-card-title">
                            <i class="fas fa-address-card"></i>
                            Contact Information
                        </h3>
                        <div class="detail-list">
                            <div class="detail-item">
                                <i class="fas fa-envelope"></i>
                                <span class="detail-label">Email</span>
                                <span class="detail-value" th:text="${attendee.email}">john.doe@example.com</span>
                            </div>
                            <div class="detail-item" th:if="${attendee.phoneNumber != null}">
                                <i class="fas fa-phone"></i>
                                <span class="detail-label">Phone</span>
                                <span class="detail-value" th:text="${attendee.phoneNumber}">+1 (555) 123-4567</span>
                            </div>
                        </div>
                    </div>

                    <!-- Professional Information -->
                    <div class="detail-card">
                        <h3 class="detail-card-title">
                            <i class="fas fa-briefcase"></i>
                            Professional Information
                        </h3>
                        <div class="detail-list">
                            <div class="detail-item" th:if="${attendee.company != null}">
                                <i class="fas fa-building"></i>
                                <span class="detail-label">Company</span>
                                <span class="detail-value" th:text="${attendee.company}">Acme Inc</span>
                            </div>
                            <div class="detail-item" th:if="${attendee.title != null}">
                                <i class="fas fa-user-tie"></i>
                                <span class="detail-label">Title</span>
                                <span class="detail-value" th:text="${attendee.title}">Software Engineer</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-buttons">
                    <a th:href="@{/attendees/{id}/edit(id=${attendee.id})}" class="btn-action btn-primary">
                        <i class="fas fa-edit"></i>
                        Edit Profile
                    </a>
                    <a th:href="@{/attendees}" class="btn-action">
                        <i class="fas fa-arrow-left"></i>
                        Back to List
                    </a>
                    <a th:href="@{/attendees/{id}/delete(id=${attendee.id})}" 
                       class="btn-action btn-danger"
                       onclick="return confirm('Are you sure you want to delete this attendee?');">
                        <i class="fas fa-trash-alt"></i>
                        Delete Profile
                    </a>
                </div>
            </div>

            <!-- Back button at the bottom -->
            <div th:replace="fragments/navigation :: back-button('/attendees', 'Back to Attendees')"></div>
        </div>
    </div>
</body>
</html>
