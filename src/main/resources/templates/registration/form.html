<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Register for Session</title>
    <style>
        /* Global Styles */
        body {
            background: #111827;
            color: #ffffff;
        }
        
        /* Registration Form */
        .registration-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .session-info {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .session-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .session-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .detail-item {
            padding: 1rem;
            background: rgba(17, 24, 39, 0.5);
            border-radius: 0.375rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .detail-label {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.25rem;
        }
        
        .detail-value {
            font-size: 1rem;
            color: #ffffff;
            font-weight: 500;
        }
        
        .form-section {
            margin-top: 2rem;
        }
        
        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(55, 65, 81, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.375rem;
            color: #ffffff;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        
        .btn-register {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            padding: 1rem 2rem;
            border-radius: 0.5rem;
            border: none;
            font-size: 1.125rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        
        .alert {
            padding: 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        
        .alert-success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #10b981;
        }
        
        .alert-danger {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }
        
        .form-check {
            display: flex;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .form-check-input {
            margin-right: 0.5rem;
        }
        
        .form-check-label {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            margin-right: -0.5rem;
            margin-left: -0.5rem;
        }
        
        .col-md-6 {
            flex: 0 0 50%;
            max-width: 50%;
            padding-right: 0.5rem;
            padding-left: 0.5rem;
        }
        
        @media (max-width: 768px) {
            .col-md-6 {
                flex: 0 0 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="registration-container">
            <!-- Session Information -->
            <div class="session-info">
                <h2 class="session-title" th:text="${sessionDetails.title}">Session Title</h2>
                <p class="lead" th:text="${sessionDetails.description}">Session description...</p>
                
                <div class="session-details">
                    <div class="detail-item">
                        <div class="detail-label">Date</div>
                        <div class="detail-value" th:text="${#temporals.format(sessionDetails.startTime, 'MMM dd, yyyy')}">Jan 01, 2024</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Time</div>
                        <div class="detail-value" th:text="${#temporals.format(sessionDetails.startTime, 'HH:mm') + ' - ' + #temporals.format(sessionDetails.endTime, 'HH:mm')}">10:00 - 11:00</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Room</div>
                        <div class="detail-value" th:text="${sessionDetails.roomNumber}">Room 101</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Available Seats</div>
                        <div class="detail-value" th:text="${sessionDetails.capacity}">50</div>
                    </div>
                </div>
            </div>

            <!-- Alert Messages -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}">
                Registration successful!
            </div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}">
                Error message
            </div>

            <!-- Registration Form -->
            <div class="form-section">
                <h3 class="form-title">Registration Details</h3>
                <form th:action="@{/register/session/{id}(id=${sessionDetails.id})}" method="post">
                    <!-- User Information -->
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" name="firstName" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" name="lastName" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="middleName" class="form-label">Middle Name</label>
                                <input type="text" class="form-control" id="middleName" name="middleName">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="title" class="form-label">Title</label>
                                <input type="text" class="form-control" id="title" name="title">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="company" class="form-label">Company</label>
                        <input type="text" class="form-control" id="company" name="company">
                    </div>

                    <div class="form-group">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber">
                    </div>
                    
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>

                    <div class="form-group">
                        <label for="passphrase" class="form-label">Passphrase</label>
                        <input type="password" class="form-control" id="passphrase" name="passphrase" required>
                        <small class="form-text text-muted">This is an additional security measure. Must be at least 4 characters.</small>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Terms and Conditions</label>
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                            <label class="form-check-label" for="terms">
                                I agree to the terms and conditions of attending this session
                            </label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-register">
                        <i class="fas fa-ticket-alt me-2"></i>Confirm Registration
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
