<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>Registration Successful</title>
    <style>
        /* Global Styles */
        body {
            background: #111827;
            color: #ffffff;
        }
        
        /* Success Container */
        .success-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: rgba(31, 41, 55, 0.8);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .success-icon {
            font-size: 4rem;
            color: #10b981;
            margin-bottom: 1rem;
        }
        
        .success-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .success-message {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .session-details {
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(55, 65, 81, 0.5);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .session-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }
        
        .navigation-buttons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            border: none;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }
        
        .btn-secondary {
            background: rgba(55, 65, 81, 0.5);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .btn-secondary:hover {
            background: rgba(55, 65, 81, 0.7);
            transform: translateY(-2px);
        }
        
        .btn i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="success-container">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            
            <h1 class="success-title">Registration Successful!</h1>
            
            <p class="success-message" th:text="${success}">
                Registration successful! Welcome to the session.
            </p>
            
            <div class="session-details">
                <h2 class="session-title" th:text="${sessionTitle}">Session Title</h2>
                <p>You have been successfully registered for this session.</p>
            </div>
            
            <div class="navigation-buttons">
                <a th:href="@{/sessions/{id}(id=${sessionId})}" class="btn btn-primary">
                    <i class="fas fa-calendar-alt"></i> View Session Details
                </a>
                <a th:href="@{/}" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Return to Home
                </a>
            </div>
        </div>
    </div>
</body>
</html>
