<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title>Users - Conference Management</title>
    <style>
        .page-header {
            margin-bottom: 2rem;
        }
        .search-section {
            margin-bottom: 2rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
        }
        .table-responsive {
            margin-bottom: 2rem;
        }
        .action-buttons .btn {
            margin-right: 0.5rem;
        }
        .empty-state {
            text-align: center;
            padding: 3rem;
            background-color: #f8f9fa;
            border-radius: 0.25rem;
        }
        .empty-state i {
            font-size: 3rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="page-header d-flex justify-content-between align-items-center">
                <h1>Users</h1>
                <a th:href="@{/users/new}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add User
                </a>
            </div>

            <div class="search-section">
                <form th:action="@{/users}" method="get" class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Search users..." name="keyword">
                            <button class="btn btn-outline-secondary" type="submit">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="btn-group" role="group">
                            <a th:href="@{/users}" class="btn btn-outline-secondary">All</a>
                            <a th:href="@{/users(filter='active')}" class="btn btn-outline-secondary">Active</a>
                            <a th:href="@{/users(filter='inactive')}" class="btn btn-outline-secondary">Inactive</a>
                        </div>
                    </div>
                </form>
            </div>

            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Name</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${users.empty}">
                            <td colspan="5">
                                <div class="empty-state">
                                    <i class="fas fa-users"></i>
                                    <h3>No users found</h3>
                                    <p>There are no users in the system yet.</p>
                                    <a th:href="@{/users/new}" class="btn btn-primary">Add User</a>
                                </div>
                            </td>
                        </tr>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.username}">username</td>
                            <td th:text="${user.email}">email@example.com</td>
                            <td th:text="${user.firstName + ' ' + user.lastName}">Full Name</td>
                            <td>
                                <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                                <span th:unless="${user.enabled}" class="badge bg-danger">Inactive</span>
                            </td>
                            <td class="action-buttons">
                                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-info">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-sm btn-warning">
                                    <i class="fas fa-edit"></i>
                                </a>
                                <a th:href="@{/users/{id}/delete(id=${user.id})}" class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Are you sure you want to delete this user?')">
                                    <i class="fas fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
