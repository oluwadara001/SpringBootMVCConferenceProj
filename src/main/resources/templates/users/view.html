<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title th:text="${user.username + ' - User Details - Conference Management'}">User Details - Conference Management</title>
    <style>
        .user-header {
            background-color: #f8f9fa;
            padding: 2rem;
            border-radius: 0.25rem;
            margin-bottom: 2rem;
        }
        .user-avatar {
            width: 100px;
            height: 100px;
            background-color: #6c757d;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .user-status {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }
        .user-status.active {
            background-color: #d4edda;
            color: #155724;
        }
        .user-status.inactive {
            background-color: #f8d7da;
            color: #721c24;
        }
        .info-section {
            background-color: #f8f9fa;
            padding: 1.5rem;
            border-radius: 0.25rem;
            margin-bottom: 1.5rem;
        }
        .info-section h3 {
            margin-bottom: 1rem;
            color: #495057;
        }
        .info-item {
            margin-bottom: 0.5rem;
        }
        .info-label {
            font-weight: 600;
            color: #495057;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container">
            <div class="user-header text-center">
                <div class="user-avatar mx-auto">
                    <i class="fas fa-user"></i>
                </div>
                <h1 th:text="${user.firstName + ' ' + user.lastName}">User Name</h1>
                <p class="text-muted" th:text="${user.username}">username</p>
                <span th:if="${user.enabled}" class="user-status active">Active</span>
                <span th:unless="${user.enabled}" class="user-status inactive">Inactive</span>
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="info-section">
                        <h3>Contact Information</h3>
                        <div class="info-item">
                            <span class="info-label">Email:</span>
                            <span th:text="${user.email}">email@example.com</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Username:</span>
                            <span th:text="${user.username}">username</span>
                        </div>
                    </div>
                </div>
                
                <div class="col-md-6">
                    <div class="info-section">
                        <h3>Account Information</h3>
                        <div class="info-item">
                            <span class="info-label">Status:</span>
                            <span th:if="${user.enabled}">Active</span>
                            <span th:unless="${user.enabled}">Inactive</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">First Name:</span>
                            <span th:text="${user.firstName}">First Name</span>
                        </div>
                        <div class="info-item">
                            <span class="info-label">Last Name:</span>
                            <span th:text="${user.lastName}">Last Name</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/users}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Users
                </a>
                <div>
                    <a th:href="@{/users/{id}/edit(id=${user.id})}" class="btn btn-warning">
                        <i class="fas fa-edit"></i> Edit User
                    </a>
                    <a th:href="@{/users/{id}/delete(id=${user.id})}" class="btn btn-danger" 
                       onclick="return confirm('Are you sure you want to delete this user?')">
                        <i class="fas fa-trash"></i> Delete User
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
